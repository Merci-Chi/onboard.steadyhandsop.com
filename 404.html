<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening agreement…</title></head><body><p>Opening your assigned agreement…</p><script>
const m=location.pathname.match(/^\/agreements\/([A-Za-z0-9_-]{7,50})\/?$/);
if(m){location.replace('/agreements/?code='+encodeURIComponent(m[1])+location.search.replace(/^\?/,'&')+location.hash)}
else{document.body.textContent='Page not found. Return to onboarding.';}
</script></body></html>
