<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>Login | Steady Hands Onboarding</title><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="styles.css"></head><body><div class="auth-layout"><section class="brand-side"><a class="brand-link" href="https://steadyhandsop.com"><img class="brand-logo" src="images/logo.png" alt=""><img class="brand-wordmark" src="images/wordmark-white.png" alt="Steady Hands"></a><div class="brand-copy"><p class="eyebrow">STEADY HANDS TEAM ONBOARDING</p><h1>We run the site.<span class="tagline-art" role="img" aria-label="You run the show."></span></h1><p>Welcome aboard. Your first steps, training, and team essentials all live here.</p></div><img class="wave" src="images/background.jpg" alt=""></section><main class="auth-side"><div class="auth-card"><div class="mobile-brand"><img src="images/logo.png" alt=""> Steady Hands</div><p class="eyebrow">YOUR WORKSPACE</p><h2 id="heading">Welcome back</h2><p id="subheading" class="sub">Sign in to access your Steady Hands onboarding.</p><form id="auth-form"><label for="email">Email address</label><input id="email" type="email" placeholder="you@company.com" autocomplete="email" required><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="Enter your password" required><button id="show-password" type="button">Show</button></div><div class="form-row"><label class="remember"><input type="checkbox" id="remember"> Save email to this device</label><button id="forgot" class="text-btn" type="button">Forgot password?</button></div><button class="primary-button full" id="submit" type="submit">Log In</button></form><p id="message" role="status" aria-live="polite"></p><p class="foot">Secure access to Steady Hands.</p></div></main></div><script type="module" src="auth.js"></script></body></html>
